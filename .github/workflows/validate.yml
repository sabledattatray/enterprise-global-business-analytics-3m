name: Portfolio Validation CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-assets-and-dax:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate DAX Measures & Currency Guardrails
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File tests/dax/validate_dax_logic.ps1

      - name: Validate Visual Design Assets & Theme JSON
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File tests/asset_checks/verify_assets.ps1
